<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESSEBI Investimenti SRL</title>
<style>
:root{--p:#1a1a2e;--s:#16213e;--a:#c9a227;--l:#f8f9fa;--g:#66707a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:var(--p)}
header{position:fixed;top:0;left:0;right:0;z-index:9;background:rgba(26,26,46,.97);display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem}
.logo{color:#fff;font-weight:800;font-size:1.05rem;letter-spacing:.5px}
.logo b{color:var(--a)}
nav{display:none;position:absolute;top:100%;left:0;right:0;background:#0f0f1a;flex-direction:column;padding:1rem 1.4rem;gap:.4rem}
nav.open{display:flex}
nav a{color:#fff;text-decoration:none;font-size:1rem;padding:.45rem 0}
#burger{display:block;background:0;border:0;color:var(--a);font-size:1.7rem;cursor:pointer}
.hero{padding:7rem 1.2rem 3.5rem;text-align:center;color:#fff;background:linear-gradient(135deg,#0f0f1a,#16213e 55%,#1a3a5c)}
.hero h1{font-size:clamp(1.7rem,6.5vw,3.2rem);line-height:1.15;margin-bottom:1rem}
.hero h1 b{color:var(--a)}
.hero p{color:#ffffffcc;max-width:620px;margin:0 auto 2rem;font-size:clamp(.95rem,2.6vw,1.15rem)}
.btn{display:inline-block;background:var(--a);border:2px solid var(--a);color:#0f0f1a;font-weight:700;padding:.85rem 1.9rem;border-radius:99px;text-decoration:none;font-size:1rem}
section{padding:3.4rem 1.2rem}
.wrap{max-width:1100px;margin:0 auto}
.t{font-size:clamp(1.45rem,4.6vw,2.2rem);text-align:center;margin-bottom:.5rem}
.sub{color:var(--g);text-align:center;margin-bottom:2.2rem}
.badges{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1.4rem 0}
.badges span{background:var(--p);color:var(--a);padding:.5rem 1.1rem;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.dark{background:#0f0f1a;color:#fff}
.dark .t{color:#fff}
.grid{display:grid;gap:1.1rem}
.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:14px;padding:1.6rem 1.3rem}
.card .n{font-size:2.2rem;font-weight:800;color:var(--a)}
.card h3{margin:.4rem 0 .6rem;font-size:1.05rem;letter-spacing:1px}
.card p{font-size:.92rem;color:#ffffffb3}
.light{background:var(--l)}
.pcard{border:1px solid #e3e3e3;border-radius:14px;overflow:hidden;background:#fff}
.pcard .hd{background:linear-gradient(135deg,var(--p),var(--s));padding:1.1rem 1.2rem}
.st{display:inline-block;background:var(--a);color:#0f0f1a;font-size:.68rem;font-weight:800;padding:.25rem .7rem;border-radius:99px;text-transform:uppercase;margin-bottom:.5rem}
.pcard .hd h3{color:#fff;font-size:1.15rem}
.pcard .bd{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1.2rem}
.lb{font-size:.68rem;color:var(--g);text-transform:uppercase;letter-spacing:1px}
.vl{font-weight:600;font-size:.95rem}
form{display:flex;flex-direction:column;gap:.8rem;max-width:480px;margin:0 auto}
input[type=email]{padding:.9rem 1.2rem;border:0;border-radius:99px;font-size:1rem}
input[type=checkbox]{accent-color:var(--a);margin-top:3px}
form label{font-size:.75rem;color:#ffffff99;display:flex;gap:.5rem;text-align:left}
form .btn{border:0;cursor:pointer;text-align:center}
.scard{background:#fff;border-left:4px solid var(--a);border-radius:14px;padding:1.5rem 1.3rem;box-shadow:0 3px 14px rgba(0,0,0,.07)}
.scard h3{font-size:1.05rem;margin-bottom:.5rem}
.scard p{font-size:.92rem;color:var(--g)}
.citem{display:flex;gap:.8rem;margin-bottom:1rem;align-items:flex-start}
.ic{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:1rem}
.citem b{display:block}
.citem a{color:var(--p)}
.cities{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin:1.6rem 0}
.cities span{border:2px solid #e3e3e3;background:#fff;border-radius:12px;padding:.7rem 1.4rem;font-weight:600}
.cities .mn{background:var(--p);color:var(--a);border-color:var(--p)}
footer{background:#0f0f1a;color:#ffffffb3;text-align:center;padding:2rem 1.2rem;font-size:.85rem}
footer b{color:#fff}
@media(min-width:820px){nav{display:flex;position:static;flex-direction:row;background:0;padding:0;gap:1.6rem}#burger{display:none}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
